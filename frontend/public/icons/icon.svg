<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#312e81" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" />

  <!-- Subtle glow overlay -->
  <rect width="512" height="512" rx="128" fill="url(#glowGradient)" />

  <!-- Hierarchy / Network Logo -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Hierarchy Connection Lines -->
    <path d="M 0 -70 L -90 60" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.85" />
    <path d="M 0 -70 L 90 60" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.85" />
    <path d="M -90 60 L 90 60" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-dasharray="14 10" opacity="0.5" />

    <!-- Top Node (Super Admin / Apex) -->
    <circle cx="0" cy="-70" r="38" fill="#ffffff" />
    <circle cx="0" cy="-70" r="22" fill="#4f46e5" />

    <!-- Left Subordinate Node -->
    <circle cx="-90" cy="60" r="32" fill="#ffffff" />
    <circle cx="-90" cy="60" r="18" fill="#6366f1" />

    <!-- Right Subordinate Node -->
    <circle cx="90" cy="60" r="32" fill="#ffffff" />
    <circle cx="90" cy="60" r="18" fill="#7c3aed" />

    <!-- Center Monogram "L" / Shield Accent -->
    <path d="M -24 -24 L -24 16 L 16 16" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" fill="none" />
  </g>

  <!-- Inner border ring -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.2" />
</svg>

